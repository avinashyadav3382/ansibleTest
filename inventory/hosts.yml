---
# EXAMPLE inventory for running the project from the command line.
# In AWX the inventory is maintained in the web UI (see SOP section 9-11);
# this file is then not used. Group names must match group_vars/*.yml exactly.
all:
  vars:
    # ansible_user: ansible_audit
    # ansible_ssh_private_key_file: ~/.ssh/rhel_audit_ed25519
    ansible_python_interpreter: auto_silent
  children:
    RHEL:
      children:
        RHEL8:
          hosts:
            RHEL-DB01:
              ansible_host: 10.10.10.11
        RHEL9:
          hosts:
            RHEL-WEB01:
              ansible_host: 10.10.10.21
        RHEL10:
          hosts:
            RHEL-DNS01:
              ansible_host: 10.10.10.31
    database:
      hosts:
        RHEL-DB01:
    web:
      hosts:
        RHEL-WEB01:
    dns:
      hosts:
        RHEL-DNS01:
