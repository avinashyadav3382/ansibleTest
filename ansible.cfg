[defaults]
roles_path          = roles
filter_plugins      = filter_plugins
inventory           = inventory/hosts.yml
forks               = 25
timeout             = 30
interpreter_python  = auto_silent
retry_files_enabled = False
deprecation_warnings = False
# AWX cannot answer an interactive "trust this host key?" prompt.
# For a hardened deployment set this to True and pre-populate known_hosts
# (for example by mounting a known_hosts file into the execution environment).
host_key_checking   = False

[ssh_connection]
pipelining = True
retries    = 2
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
